<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#071018">
<title>Zenith Nexus — Demo</title>

<!-- Google Fonts: Plus Jakarta Sans -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #050a10;
  --panel: rgba(10, 18, 27, 0.75);
  --panel2: #0d1722;
  --line: rgba(38, 55, 70, 0.6);
  --gold: #e8bd45;
  --gold2: #f4d36b;
  --gold-glow: rgba(232, 189, 69, 0.25);
  --text: #f5f7fa;
  --muted: #9da8b3;
  --cyan: #29c7ed;
  --green: #28c77b;
  --red: #ff6262;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: 'Plus Jakarta Sans', sans-serif;
  background-image: radial-gradient(circle at 50% 0%, #0d2235 0%, #050a10 70%);
  background-attachment: fixed;
}

button { font: inherit; }

.app {
  width: 100%;
  max-width: 760px;
  margin: auto;
  min-height: 100vh;
  padding-bottom: 105px;
}

/* Header Modern */
header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 20px;
  background: rgba(7, 12, 18, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(232, 189, 69, 0.3);
}

.logo-img {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  border: 1.5px solid var(--gold);
  object-fit: cover;
  box-shadow: 0 0 12px var(--gold-glow);
}

.header-title b { display: block; color: var(--gold2); font-size: 19px; font-weight: 800; letter-spacing: 0.5px; }
.header-title small { color: #89939d; letter-spacing: 1.5px; font-size: 9px; font-weight: 600; }

.header-bell {
  margin-left: auto;
  border: 1px solid var(--line);
  background: var(--panel);
  color: white;
  border-radius: 12px;
  width: 42px;
  height: 42px;
  cursor: pointer;
  transition: all 0.2s;
  display: grid;
  place-items: center;
  font-size: 18px;
}
.header-bell:hover { border-color: var(--gold); box-shadow: 0 0 10px var(--gold-glow); }

main { padding: 20px; }

/* Hero Section */
.hero {
  position: relative;
  overflow: hidden;
  min-height: 260px;
  padding: 30px 25px;
  border: 1px solid rgba(232, 189, 69, 0.35);
  border-radius: 24px;
  background: radial-gradient(circle at 90% 30%, #12425a, #071018 75%);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.hero small { color: var(--gold2); font-weight: 700; letter-spacing: 1px; font-size: 11px; }
.hero h1 { margin-top: 14px; font-size: 32px; font-weight: 800; line-height: 1.15; }
.hero h1 span { color: var(--gold2); }
.hero p { margin-top: 14px; color: #c5cbd0; font-size: 13px; line-height: 1.5; }
.chart { font-size: 70px; filter: drop-shadow(0 0 18px rgba(41, 199, 237, 0.4)); }

.section-title { margin: 28px 0 14px; font-size: 17px; font-weight: 700; color: var(--gold2); letter-spacing: 0.5px; }

/* Grid Card Glassmorphism */
.quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

.card {
  min-height: 150px;
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--panel);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.card:hover {
  border-color: var(--gold);
  box-shadow: 0 8px 25px var(--gold-glow);
  transform: translateY(-3px);
}

.card:active, .action:active, .nav-btn:active { transform: scale(0.97); }

.card .icon { font-size: 30px; }
.card b { display: block; margin-top: 14px; color: var(--gold2); font-size: 16px; font-weight: 700; }
.card p { margin-top: 6px; color: var(--muted); font-size: 12px; line-height: 1.4; }
.card .arrow { float: right; margin-top: -8px; color: var(--gold); font-size: 24px; font-weight: 700; }

/* Spin Card */
.spin {
  margin-top: 14px;
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--panel);
  backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  gap: 18px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.spin:hover {
  border-color: var(--gold);
  box-shadow: 0 8px 25px var(--gold-glow);
  transform: translateY(-3px);
}

.wheel {
  flex: 0 0 70px;
  width: 70px;
  height: 70px;
  border: 2px solid var(--gold);
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--gold);
  font-size: 32px;
  box-shadow: 0 0 15px var(--gold-glow);
  transition: transform 1s cubic-bezier(.2, .8, .2, 1);
}

.spin h2 { color: var(--gold2); font-size: 20px; font-weight: 700; }
.spin p { color: var(--muted); margin-top: 4px; font-size: 12px; }
.spin .arrow { margin-left: auto; color: var(--gold); font-size: 24px; font-weight: 700; }

/* Stats Table Grid */
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  margin-top: 20px;
  border: 1px solid var(--line);
  border-radius: 20px;
  overflow: hidden;
  background: var(--panel);
  backdrop-filter: blur(12px);
}

.stat {
  min-height: 100px;
  padding: 14px 6px;
  text-align: center;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.stat:nth-child(4n) { border-right: 0; }
.stat:nth-child(n+5) { border-bottom: 0; }
.stat .emoji { font-size: 22px; }
.stat small { display: block; color: var(--muted); font-size: 10px; margin: 6px 0 4px; font-weight: 600; }
.stat b { color: var(--cyan); font-size: 15px; font-weight: 700; }

/* Page Navigation */
.page { display: none; }
.page.active { display: block; }
.page-head { margin-bottom: 18px; }
.page-head h2 { color: var(--gold2); font-size: 24px; font-weight: 800; }
.page-head p { color: var(--muted); margin-top: 4px; font-size: 13px; }

.panel {
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--panel);
  backdrop-filter: blur(12px);
  margin-bottom: 12px;
  transition: all 0.3s ease;
}

.market-row { display: flex; align-items: center; gap: 12px; }
.coin-icon {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #16232f;
  color: var(--gold);
  font-weight: 800;
  font-size: 18px;
  border: 1px solid rgba(232, 189, 69, 0.3);
}

.coin-info { flex: 1; }
.coin-info b { display: block; font-size: 15px; }
.coin-info small { color: #737f89; font-size: 12px; }

.price { text-align: right; }
.price b { display: block; font-size: 14px; }
.up { color: var(--green) !important; }
.down { color: var(--red) !important; }

.action {
  border: 0;
  border-radius: 12px;
  padding: 10px 16px;
  background: linear-gradient(135deg, var(--gold2), var(--gold));
  color: #0b141d;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 4px 15px var(--gold-glow);
  transition: all 0.2s;
}
.action:hover { filter: brightness(1.1); transform: translateY(-1px); }

.full { width: 100%; padding: 13px; margin-top: 8px; }

.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.summary .panel { text-align: center; margin: 0; }
.summary b { display: block; font-size: 20px; color: var(--cyan); }
.summary small { color: var(--muted); font-size: 11px; }

.menu-item {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 16px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  transition: background 0.2s;
}
.menu-item:hover { background: rgba(255, 255, 255, 0.03); }
.menu-item:last-child { border-bottom: 0; }
.menu-item .mi-icon { font-size: 20px; width: 30px; }
.menu-item div { flex: 1; }
.menu-item small { display: block; color: var(--muted); margin-top: 3px; font-size: 12px; }
.menu-item strong { color: var(--gold); font-size: 20px; }

.notice {
  padding: 14px;
  border: 1px solid rgba(232, 189, 69, 0.4);
  border-radius: 16px;
  background: rgba(18, 20, 14, 0.8);
  color: #d9d0a9;
  font-size: 13px;
  line-height: 1.5;
  margin-bottom: 15px;
}

/* Modal */
.modal {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: none;
  align-items: flex-end;
  justify-content: center;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(6px);
  padding: 15px;
}
.modal.show { display: flex; }
.modal-box {
  width: 100%;
  max-width: 500px;
  background: #0b141d;
  border: 1px solid var(--gold);
  border-radius: 24px;
  padding: 24px;
  box-shadow: 0 20px 60px #000;
}
.modal-box h3 { color: var(--gold2); margin-bottom: 10px; font-size: 20px; }
.modal-box p { color: var(--muted); line-height: 1.5; font-size: 14px; }

.input {
  width: 100%;
  margin: 15px 0;
  padding: 13px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: #071019;
  color: white;
  outline: none;
  font-family: inherit;
}
.close { background: transparent !important; color: #aaa !important; border: 1px solid var(--line) !important; box-shadow: none !important; }

/* Navigation Bar */
nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  z-index: 30;
  width: 100%;
  max-width: 760px;
  height: 80px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: rgba(6, 11, 17, 0.9);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}

.nav-btn {
  border: 0;
  background: transparent;
  color: #89929a;
  cursor: pointer;
  font-size: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.nav-btn small { display: block; margin-top: 4px; font-size: 11px; font-weight: 600; }
.nav-btn.active { color: var(--gold2); text-shadow: 0 0 10px var(--gold-glow); }

/* Toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: 95px;
  transform: translate(-50%, 20px);
  opacity: 0;
  pointer-events: none;
  z-index: 60;
  background: #17232e;
  color: white;
  border: 1px solid var(--gold);
  border-radius: 12px;
  padding: 12px 20px;
  transition: all 0.25s ease;
  white-space: nowrap;
  font-size: 13px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.5);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media(max-width: 520px) {
  main { padding: 14px; }
  .hero { min-height: 240px; padding: 22px 18px; }
  .hero h1 { font-size: 26px; }
  .chart { font-size: 50px; }
  .stats { grid-template-columns: repeat(4, 1fr); }
  .stat { min-height: 90px; }
  .quick-grid { gap: 10px; }
  .card { padding: 16px; }
  .card b { font-size: 15px; }
  .card p { font-size: 11px; }
  .summary { grid-template-columns: 1fr 1fr; }
  .summary .panel:last-child { grid-column: 1 / -1; }
}
</style>
</head>
